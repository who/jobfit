[project]
name = "jobfit"
version = "0.1.0"
description = "A tool for checking job-resume fit"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "pymupdf",
    "python-docx",
    "python-dotenv>=1.2.1",
    "rich",
]

[project.scripts]
jobfit = "jobfit.main:main"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.3.0",
    "ruff",
]
